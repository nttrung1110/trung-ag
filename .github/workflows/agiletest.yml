name: agiletest

on:
  workflow_dispatch:
    inputs:
      execution_key:
        description: AgileTest Test Execution key (e.g. SCRUM-217)
        required: true
        type: string

jobs:
  import-and-report:
    runs-on: ubuntu-latest
    env:
      EXECUTION_KEY: ${{ inputs.execution_key }}
      WEB_TRIGGER_URL: ${{ secrets.WEB_TRIGGER_URL }}
      CLIENT_ID: ${{ secrets.CLIENT_ID }}
      CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - name: Import sample results to AgileTest
        run: |
          PROJECT_KEY="${EXECUTION_KEY%%-*}"
          STATUS=$(curl -s -o response.json -w "%{http_code}" -X POST \
            "$WEB_TRIGGER_URL?action=import&framework=junit&projectKey=$PROJECT_KEY&requestId=$GITHUB_RUN_ID&testExecutionKey=$EXECUTION_KEY" \
            -H "x-agiletest-client-id: $CLIENT_ID" \
            -H "x-agiletest-client-secret: $CLIENT_SECRET" \
            --data-binary @sample-junit.xml)
          echo "HTTP status $STATUS"; cat response.json
          if [ "$STATUS" != "200" ] && [ "$STATUS" != "202" ]; then exit 1; fi

      - name: Report run to AgileTest
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          case "$JOB_STATUS" in
            success) RESULT=success ;;
            cancelled) RESULT=canceled ;;
            *) RESULT=failed ;;
          esac
          PROJECT_KEY="${EXECUTION_KEY%%-*}"
          curl -s -w "\nPipeline log HTTP status %{http_code}\n" -X POST \
            "$WEB_TRIGGER_URL?action=pipeline-log&projectKey=$PROJECT_KEY&testExecutionKey=$EXECUTION_KEY" \
            -H "x-agiletest-client-id: $CLIENT_ID" \
            -H "x-agiletest-client-secret: $CLIENT_SECRET" \
            -H "Content-Type: application/json" \
            -d "{\"tool\":\"github\",\"result\":\"$RESULT\",\"repository\":\"$GITHUB_REPOSITORY\",\"runId\":\"$GITHUB_RUN_ID\",\"description\":\"Import JUnit results\"}"
